{% extends 'blog/base.html' %}
{% block content %}

<div class="form-page-header">
    <p class="form-page-title">Edit Post</p>
    <p class="form-page-subtitle">Update your post details</p>
</div>

<div class="post-form-card" style="max-width: 800px;">

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label-modern">Title</label>
            <input type="text" class="form-control input-modern"
                name="title" value="{{ post.title }}" required>
        </div>

        <div class="mb-4">
            <label class="form-label-modern">Content</label>
            <textarea class="form-control input-modern"
                rows="6" name="content" required>{{ post.content }}</textarea>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-submit" type="submit">
                Update Post
            </button>
            <a href="{% url 'my-post' %}" class="btn btn-cancel">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
