{% extends 'blog/base.html' %}
{% load static %}

{% block content %}

<style>
    .form-page-header {
        margin-bottom: 24px;
    }

    .form-page-title {
        font-weight: 800;
        color: var(--text-dark);
        font-size: 1.8rem;
        margin-bottom: 4px;
    }

    .form-page-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .post-form-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 36px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .form-label-modern {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 6px;
    }

    .input-modern {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .input-modern:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
    }

    textarea.input-modern {
        resize: vertical;
    }

    .btn-submit {
        background: var(--primary);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 10px 28px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .btn-submit:hover {
        background: var(--primary-dark);
        color: #fff;
    }

    .btn-cancel {
        border: 1px solid var(--border);
        color: var(--text-dark);
        font-weight: 500;
        border-radius: 10px;
        padding: 10px 24px;
        font-size: 0.95rem;
        background: #fff;
        transition: all 0.2s ease;
    }

    .btn-cancel:hover {
        background: var(--bg-soft);
        color: var(--text-dark);
    }
</style>

<div class="form-page-header">
    <p class="form-page-title">Make a New Post</p>
    <p class="form-page-subtitle">Share your thoughts with the community</p>
</div>

<div class="post-form-card" style="max-width: 800px;">

    <form method="post">
        {% csrf_token %}

        <!-- Title -->
        <div class="mb-3">
            <label class="form-label-modern">Title</label>
            <input type="text" class="form-control input-modern"
                name="title" placeholder="Give your post a title" required>
        </div>

        <!-- Content -->
        <div class="mb-4">
            <label class="form-label-modern">Content</label>
            <textarea class="form-control input-modern"
                rows="6" name="content" placeholder="Write your post here..." required></textarea>
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button class="btn btn-submit" type="submit">
                Publish Post
            </button>
            <a href="{% url 'home-page' %}" class="btn btn-cancel">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
