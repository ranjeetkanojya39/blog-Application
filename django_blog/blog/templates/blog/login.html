{% extends 'blog/base.html' %}
{% load static %}

{% block content %}

<style>
    .login-wrapper {
        min-height: 75vh;
        display: flex;
        align-items: center;
    }

    .login-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .login-logo {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 3px solid var(--primary-light);
    }

    .login-title {
        font-weight: 700;
        color: var(--text-dark);
        font-size: 1.5rem;
        margin-bottom: 4px;
    }

    .login-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 28px;
    }

    .form-label-modern {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 6px;
    }

    .input-modern {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .input-modern:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
    }

    .btn-login {
        background: var(--primary);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 11px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .btn-login:hover {
        background: var(--primary-dark);
        color: #fff;
    }

    .register-text {
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .register-text a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
    }

    .register-text a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-5">
                <div class="login-card">

                    <!-- Logo -->
                    <div class="text-center mb-3">
                        <img src="{% static 'images/logo.png' %}"
                             class="rounded-circle login-logo" alt="logo">
                    </div>

                    <div class="text-center">
                        <p class="login-title">Welcome back</p>
                        <p class="login-subtitle">Login to continue to BlogApp</p>
                    </div>

                    <!-- Login Form -->
                    <form method="post">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label-modern">Username</label>
                            <input type="text"
                                   name="uname"
                                   class="form-control input-modern"
                                   placeholder="Enter your username"
                                   required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label-modern">Password</label>
                            <input type="password"
                                   name="upassword"
                                   class="form-control input-modern"
                                   placeholder="Enter your password"
                                   required>
                        </div>

                        <!-- Button -->
                        <button type="submit"
                                class="btn btn-login w-100 mt-2">
                            Login
                        </button>

                    </form>

                    <!-- Register Link -->
                    <p class="text-center register-text mt-4 mb-0">
                        Not registered?
                        <a href="/">Create Account</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
